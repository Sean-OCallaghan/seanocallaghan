<!doctype html>
<html lang="en" data-theme="mono">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Option 1 Sizes — Sean OCallaghan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ───────────── Color schemes ───────────── */
    :root,
    [data-theme="mono"] {
      --bg: #0a0a0b; --surface: #131315; --surface-2: #19191c; --border: #26262b;
      --text: #ededef; --dim: #9a9aa3; --accent: #4d8dff; --accent-rgb: 77, 141, 255; --accent-ink: #050a14;
    }
    [data-theme="amber"] {
      --bg: #0f0b05; --surface: #17110a; --surface-2: #1f170d; --border: #2e2313;
      --text: #ffe2a8; --dim: #a8874a; --accent: #ffb000; --accent-rgb: 255, 176, 0; --accent-ink: #1a1203;
    }
    [data-theme="violet"] {
      --bg: #0e0d13; --surface: #15141c; --surface-2: #1b1a24; --border: #2a2836;
      --text: #ecebf5; --dim: #9b98ad; --accent: #a78bfa; --accent-rgb: 167, 139, 250; --accent-ink: #120b24;
    }
    [data-theme="forest"] {
      --bg: #0a0f0c; --surface: #111814; --surface-2: #16201a; --border: #22302a;
      --text: #e6efe9; --dim: #8fa398; --accent: #8fbf9f; --accent-rgb: 143, 191, 159; --accent-ink: #0a140e;
    }

    :root {
      --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
      --bar-h: 60px;
      --gutter: clamp(16px, 4vw, 48px);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: var(--bar-h); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      transition: background 0.4s var(--ease), color 0.4s var(--ease);
    }
    a { color: inherit; text-decoration: none; }
    h1, p { margin: 0; }
    img { display: block; max-width: 100%; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

    /* ───────────── Switcher bar ───────────── */
    .bar {
      position: sticky; top: 0; z-index: 50;
      height: var(--bar-h);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 0 var(--gutter);
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .bar-title { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); white-space: nowrap; }
    .bar-group { display: flex; align-items: center; gap: 4px; }
    .pill {
      font: 500 0.75rem var(--mono);
      color: var(--dim);
      background: transparent;
      border: 1px solid transparent;
      padding: 6px 10px; border-radius: 999px;
      cursor: pointer; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .pill:hover { color: var(--text); background: var(--surface-2); }
    .pill[aria-pressed="true"] { color: var(--text); border-color: var(--border); background: var(--surface-2); }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); }

    /* ───────────── Variant wrapper ───────────── */
    .variant { padding: 28px var(--gutter) 0; }
    .variant-label {
      display: inline-block;
      margin-bottom: 14px;
      font: 500 0.6875rem var(--mono);
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent);
      padding: 5px 10px; border-radius: 999px;
      border: 1px solid rgba(var(--accent-rgb), 0.35);
      background: rgba(var(--accent-rgb), 0.08);
    }
    .variant-note { font: 0.75rem var(--mono); color: var(--dim); margin-left: 10px; }
    /* Dashed outline shows exactly how much of the page the header takes */
    .variant-frame { border: 1px dashed var(--border); border-radius: 16px; }
    .page-filler { padding: 20px 24px; font: 0.75rem var(--mono); color: var(--dim); opacity: 0.6; }

    /* ───────────── Split hero, scaled by --s ─────────────
       --s: 1 = the original full-screen version.          */
    .hero {
      --s: 1;
      position: relative;
      min-height: calc((100svh - var(--bar-h)) * var(--s));
      display: flex; align-items: center;
      padding: max(20px, calc(72px * var(--s))) max(20px, calc(48px * var(--s)));
    }
    .split {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: max(20px, calc(96px * var(--s)));
      max-width: 1200px; width: 100%; margin: 0 auto;
    }
    .hello {
      font-family: var(--mono);
      font-size: max(0.6875rem, calc(0.8125rem * var(--s)));
      color: var(--dim);
      margin-bottom: max(6px, calc(20px * var(--s)));
    }
    .split h1 {
      font-size: max(1.75rem, calc(clamp(3rem, 8.5vw, 7.5rem) * var(--s)));
      font-weight: 800; letter-spacing: -0.05em; line-height: 0.92;
    }
    .split h1 span { display: block; }
    .split h1 .last { color: var(--accent); }
    .title {
      display: flex; align-items: center; gap: max(8px, calc(14px * var(--s)));
      margin: max(10px, calc(28px * var(--s))) 0 max(14px, calc(36px * var(--s)));
      font-size: max(0.9375rem, calc(clamp(1.125rem, 2vw, 1.5rem) * var(--s)));
      font-weight: 500;
    }
    .title::before { content: ""; width: max(16px, calc(40px * var(--s))); height: 2px; background: var(--accent); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: max(8px, calc(12px * var(--s))) max(14px, calc(20px * var(--s)));
      border-radius: 999px;
      font: 500 max(0.8125rem, calc(0.9375rem * var(--s))) var(--sans);
      border: 1px solid var(--border);
      color: var(--text);
      transition: transform 0.2s var(--ease), border-color 0.2s, filter 0.2s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn svg { width: 14px; height: 14px; }

    .frame {
      position: relative;
      width: max(96px, calc(clamp(240px, 32vw, 440px) * var(--s)));
      aspect-ratio: 4 / 5;
      border-radius: max(14px, calc(28px * var(--s)));
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 calc(40px * var(--s)) calc(80px * var(--s)) calc(-40px * var(--s)) rgba(var(--accent-rgb), 0.45);
    }
    .frame::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.55)); }
    .photo { width: 100%; height: 100%; object-fit: cover; }
    .badge {
      position: absolute; left: 12px; bottom: 12px; z-index: 2;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px;
      font: 500 0.6875rem var(--mono);
      background: color-mix(in srgb, var(--bg) 70%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      white-space: nowrap;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), 0.18); flex: none; }

    /* Compact variant: badge moves next to the title instead of over a tiny photo */
    .compact .badge { display: none; }
    .compact .inline-status { display: inline-flex; }
    .inline-status { display: none; align-items: center; gap: 8px; font: 500 0.6875rem var(--mono); color: var(--dim); margin-left: 6px; }

    @media (max-width: 760px) {
      :root { --bar-h: 96px; }
      .bar { flex-direction: column; justify-content: center; align-items: stretch; gap: 6px; padding: 8px 16px; }
      .bar-title { display: none; }
      .bar-group { overflow-x: auto; scrollbar-width: none; }
      .hero:not(.compact) .split { grid-template-columns: 1fr; gap: 24px; }
      .hero:not(.compact) .frame { order: -1; width: min(60%, 220px); }
      .badge { display: none; }
      .title { flex-wrap: wrap; }
      .inline-status, .compact .inline-status { display: inline-flex; flex-basis: 100%; margin: 4px 0 0; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>

  <nav class="bar" aria-label="Design switcher">
    <span class="bar-title">Option 1 · Split hero · sizes</span>
    <div class="bar-group" role="group" aria-label="Size">
      <a class="pill" href="#v-75">1A · 75% size</a>
      <a class="pill" href="#v-25">1B · 25% size</a>
    </div>
    <div class="bar-group" role="group" aria-label="Color scheme">
      <button class="pill" data-theme-btn="mono"><span class="swatch" style="background:#4d8dff"></span>Mono</button>
      <button class="pill" data-theme-btn="amber"><span class="swatch" style="background:#ffb000"></span>Amber</button>
      <button class="pill" data-theme-btn="violet"><span class="swatch" style="background:#a78bfa"></span>Violet</button>
      <button class="pill" data-theme-btn="forest"><span class="swatch" style="background:#8fbf9f"></span>Forest</button>
    </div>
  </nav>

  <template id="hero-tpl">
    <div class="split">
      <div>
        <p class="hello">Hello, I’m</p>
        <h1><span>Sean</span><span class="last">OCallaghan</span></h1>
        <p class="title">Software Engineer <span class="inline-status"><span class="dot"></span>Available for work</span></p>
        <div class="actions">
          <a class="btn btn-primary" href="#">View my work <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
          <a class="btn" href="#">Get in touch</a>
        </div>
      </div>
      <div class="frame">
        <img class="photo" data-photo alt="Portrait of Sean OCallaghan" />
        <span class="badge"><span class="dot"></span>Available for work</span>
      </div>
    </div>
  </template>

  <section class="variant" id="v-75">
    <span class="variant-label">1A · 75% size</span><span class="variant-note">header takes about 75% of the screen</span>
    <div class="variant-frame">
      <header class="hero" style="--s: 0.75" data-hero></header>
    </div>
    <p class="page-filler">↓ rest of the page starts here</p>
  </section>

  <section class="variant" id="v-25">
    <span class="variant-label">1B · 25% size</span><span class="variant-note">compact header, about 25% of the screen</span>
    <div class="variant-frame">
      <header class="hero compact" style="--s: 0.25" data-hero></header>
    </div>
    <p class="page-filler">↓ rest of the page starts here</p>
    <div style="height: 60vh"></div>
  </section>

  <script>
    // ── Swap this for your real photo, e.g. "assets/me.jpg" ──
    const PHOTO = "assets/photo-placeholder.svg";

    const tpl = document.getElementById("hero-tpl");
    document.querySelectorAll("[data-hero]").forEach((h) => h.appendChild(tpl.content.cloneNode(true)));
    document.querySelectorAll("[data-photo]").forEach((img) => (img.src = PHOTO));

    const root = document.documentElement;
    const btns = document.querySelectorAll("[data-theme-btn]");
    const setTheme = (t) => {
      root.dataset.theme = t;
      btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeBtn === t)));
      try { localStorage.setItem("header-theme", t); } catch {}
    };
    let saved = "mono";
    try { saved = localStorage.getItem("header-theme") || "mono"; } catch {}
    setTheme(saved);
    btns.forEach((b) => b.addEventListener("click", () => setTheme(b.dataset.themeBtn)));
  </script>
</body>
</html>
